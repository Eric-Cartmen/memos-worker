name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "6dc0e4a9-6ca9-493e-aac1-0df287c8ab9d"
database_name = "notes-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "9679731ed0f84805b054cdae923105cf"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "notes-r2-bucket"
preview_bucket_name = "notes-files-preview"
